<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      /* Adapt to color scheme */
      @media (prefers-color-scheme: light) {
        .glass-ring { stroke: #374151; }
        .glass-handle { stroke: #374151; }
        .error-mark { fill: #dc2626; }
      }
      @media (prefers-color-scheme: dark) {
        .glass-ring { stroke: #e5e7eb; }
        .glass-handle { stroke: #e5e7eb; }
        .error-mark { fill: #f87171; }
      }
    </style>
  </defs>

  <!-- Magnifying glass ring -->
  <circle
    class="glass-ring"
    cx="13"
    cy="13"
    r="9"
    fill="none"
    stroke="#374151"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Magnifying glass handle -->
  <line
    class="glass-handle"
    x1="20"
    y1="20"
    x2="28"
    y2="28"
    stroke="#374151"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Error exclamation mark inside the glass -->
  <g class="error-mark" fill="#dc2626">
    <!-- Exclamation line -->
    <rect x="11.5" y="7" width="3" height="8" rx="1.5"/>
    <!-- Exclamation dot -->
    <circle cx="13" cy="18" r="1.8"/>
  </g>
</svg>

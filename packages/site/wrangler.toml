# Cloudflare Pages project config, read by `wrangler pages deploy` / `pages dev`
# (scripts/deploy-site.sh runs from this directory). nodejs_compat: prerendered
# routes bundle node:fs-using data loaders into _worker.js; the flag keeps the
# runtime from rejecting those imports even though on-demand routes never call
# them.
name = "errlookup"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Server-side traffic analytics (Workers Analytics Engine). The site's traffic
# is >90% crawlers, which no JS beacon can see — the middleware writes one data
# point per worker-routed request instead. Query via the AE SQL API
# (scripts/report-top-pages.sh).
[[analytics_engine_datasets]]
binding = "TRAFFIC"
dataset = "errlookup_traffic"

# Platform-persisted invocation logs (Workers Logs): NOT configurable for
# Pages projects from here — wrangler rejects an [observability] block in
# Pages configs (checked through 4.129), the Pages project API silently drops
# the key, and the pages-worker script is not addressable via the Workers
# script-settings API (all probed 2026-09-03). Robust 5xx visibility is
# provided in-code instead: the middleware records failures to the TRAFFIC
# dataset BEFORE rethrowing (middleware.ts), and scripts/alert-5xx.sh queries
# that dataset hourly and alerts. If Cloudflare ships Pages observability
# config or the site migrates to Workers, prefer the platform hook.

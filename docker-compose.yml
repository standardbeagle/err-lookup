services:
  postgres:
    image: postgres:16-alpine
    container_name: err-lookup-postgres
    environment:
      POSTGRES_USER: errlookup
      POSTGRES_PASSWORD: errlookup_dev
      POSTGRES_DB: errlookup
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errlookup"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: err-lookup-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
